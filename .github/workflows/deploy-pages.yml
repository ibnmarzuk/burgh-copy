name: Build BURGH website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Add SPA fallback for direct route visits
        run: cp dist/index.html dist/404.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: burgh-production-build
          path: dist
          retention-days: 7
